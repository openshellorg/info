name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup D compiler
        uses: dlang-community/setup-dlang@v2
        with:
          compiler: ldc-latest

      - name: Build
        run: dub build --build=release

      - name: Smoke
        shell: bash
        run: |
          if [ -f info.exe ]; then BIN=./info.exe; else BIN=./info; fi
          "$BIN" --help
          "$BIN" --version
          "$BIN" --dump 2>/dev/null || true
